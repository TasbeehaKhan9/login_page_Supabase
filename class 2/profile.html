<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
    <style>
        button{
            background-color: transparent;
            border: none;
            position: absolute;
            right: 20px;
            font-size: 2em;
            top: 0px;
        }
        /* Reset basic spacing */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

/* Page background */
body {
  background: #f5f7fb;
  min-height: 100vh;
}

/* Username / heading */
#name {
  text-align: center;
  margin: 30px 0 10px;
  font-size: 26px;
  font-weight: 600;
  color: #333;
}

/* Main container */
.container {
  max-width: 500px;
  margin: 20px auto;
}

/* Form card */
form {
  background: #fff;
  padding: 22px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
}

/* Labels */
label {
  font-weight: 500;
  color: #444;
}

/* Inputs & textarea */
#title,
#description {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border-radius: 8px;
  border: 1px solid #ddd;
  outline: none;
  font-size: 14px;
}

#title:focus,
#description:focus {
  border-color: #0d6efd;
}

/* Description textarea */
#description {
  min-height: 100px;
  resize: none;
}

/* Priority radios */
.mb-3 input[type="radio"] {
  margin-left: 10px;
  margin-right: 4px;
}

/* Add Todo button */
#addTodo {
  margin-top: 350px;
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  background: #0d6efd;
  color: #fff;
  cursor: pointer;
}

#addTodo:hover {
  background: #0b5ed7;
}

/* Todo list container */
#main {
  margin-top: 25px;
}

/* Logout button (top-right clean icon) */
#logoutBtn {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #dc3545;
  color: #fff;
  border: none;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
}

#logoutBtn:hover {
  background: #bb2d3b;
}


    </style>
</head>
<body>
    

    <h2 id="name"></h2>
<div class="container">
    <form id="btn">
  <div class="mb-3">
    <label  class="form-label">Title</label>
    <input type="text" class="form-control" id="title" >
   
  </div>
  <div class="mb-3">
     <input type="radio" name="priority" value="high">
    <label for="">High</label>

  <input type="radio" name="priority" id="" value="med">
  <label for="">Medium</label>
   <input type="radio" name="priority" id="" value="low">
   <label for="">Low</label>
  </div>
  <div class="mb-3 form-check">
    <label for=""> Description</label>
    <Textarea placeholder="description" id="description" ></Textarea>
  </div>
  <button type="submit" id="addTodo"  class="btn btn-primary">Add Todo</button>
</form>
</div>
<div class="container">
    <div id="main" class="d-flex gap-2 flex-wrap"></div>
</div>

    <button id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i></button>
       <script type="module" src="config.js"></script>
   <script type="module" src="index.js"></script>
   <script type="module" src="db.js"></script>
</body>
</html>
