        /* Reset basic spacing */
/* ===== Reset ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}

:root{
  --bg1:#eef2ff;
  --bg2:#f7fbff;
  --card: rgba(255,255,255,.72);
  --stroke: rgba(255,255,255,.45);
  --text:#0f172a;
  --muted:#64748b;
  --primary:#2563eb;
  --primary2:#1d4ed8;
  --danger:#ef4444;
  --shadow: 0 18px 55px rgba(2,6,23,.12);
  --shadow2: 0 10px 25px rgba(2,6,23,.10);
  --radius: 18px;
}

/* ===== Background WOW ===== */
body{
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(900px 400px at 10% 0%, rgba(37,99,235,.18), transparent 60%),
    radial-gradient(700px 380px at 90% 10%, rgba(99,102,241,.15), transparent 55%),
    linear-gradient(180deg, var(--bg2), var(--bg1));
  padding: 18px;
  overflow-x:hidden;
}

/* ===== Heading ===== */
#name{
  text-align:center;
  margin: 22px 0 18px;
  font-weight: 900;
  letter-spacing:.3px;
  font-size: clamp(22px, 3vw, 34px);
  color:#0b1220;
}

/* ===== Containers ===== */
.container{
  width: min(760px, 100%);
  margin: 0 auto;
  padding: 6px;
}

/* ===== Form Card (Glass) ===== */
form{
  background: var(--card);
  border: 1px solid var(--stroke);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: clamp(16px, 2.6vw, 30px);
  transition: transform .25s ease, box-shadow .25s ease;
}
form:hover{
  transform: translateY(-2px);
  box-shadow: 0 22px 70px rgba(2,6,23,.14);
}

/* spacing */
.mb-3{
  margin-bottom: 14px;
}

/* ===== Labels ===== */
label.form-label,
.mb-3.form-check > label{
  display:block;
  font-weight: 800;
  font-size: 14px;
  color:#0f172a;
  margin-bottom: 8px;
}

/* ===== Inputs / Textarea ===== */
#title,
#description{
  width:100%;
  padding: 13px 14px;
  border-radius: 14px;
  border: 1px solid rgba(148,163,184,.45);
  background: rgba(255,255,255,.88);
  outline:none;
  font-size: 14px;
  color: var(--text);
  box-shadow: 0 6px 18px rgba(2,6,23,.06);
  transition: border-color .2s ease, box-shadow .2s ease, transform .15s ease;
}

#title:focus,
#description:focus{
  border-color: rgba(37,99,235,.75);
  box-shadow: 0 0 0 5px rgba(37,99,235,.14), 0 10px 24px rgba(2,6,23,.08);
  transform: translateY(-1px);
}

#description{
  min-height: 140px;
  resize: vertical;
}

/* ===== Priority Chips ===== */
.priority{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  padding-top: 6px;
}

.priority-title{
  width:100%;
  font-weight: 800;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 4px;
}

/* hide radios but keep accessible */
.priority input[type="radio"]{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

/* chip */
.chip{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding: 10px 14px;
  border-radius: 999px;
  border: 1px solid rgba(148,163,184,.45);
  background: rgba(255,255,255,.78);
  cursor:pointer;
  user-select:none;
  font-weight: 900;
  box-shadow: 0 10px 22px rgba(2,6,23,.08);
  transition: transform .15s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
}

.chip::before{
  content:"";
  width:10px;
  height:10px;
  border-radius:50%;
  background: rgba(100,116,139,.35);
}

/* checked state */
.priority input[type="radio"]:checked + .chip{
  border-color: rgba(37,99,235,.65);
  background: rgba(37,99,235,.10);
  box-shadow: 0 0 0 4px rgba(37,99,235,.10), 0 14px 30px rgba(2,6,23,.10);
  transform: translateY(-1px);
}
.priority input[type="radio"]:checked + .chip::before{
  background: var(--primary);
}

/* hover */
.chip:hover{
  transform: translateY(-1px);
  box-shadow: 0 16px 34px rgba(2,6,23,.12);
}

/* optional different dots */
.chip.high::before{ background: rgba(239,68,68,.45); }
.chip.med::before{ background: rgba(245,158,11,.45); }
.chip.low::before{ background: rgba(34,197,94,.45); }

.priority input[type="radio"]:checked + .chip.high::before{ background:#ef4444; }
.priority input[type="radio"]:checked + .chip.med::before{ background:#f59e0b; }
.priority input[type="radio"]:checked + .chip.low::before{ background:#22c55e; }

/* ===== Button (fix: no fixed position, no 350px margin) ===== */
#addTodo{
  width:100%;
  padding: 13px 16px;
  border:none;
  border-radius: 16px;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: .35px;
  color:#fff;
  cursor:pointer;

  background: linear-gradient(135deg, var(--primary), #3b82f6, #6366f1);
  box-shadow: 0 16px 40px rgba(37,99,235,.25);
  transition: transform .16s ease, box-shadow .2s ease, filter .2s ease;
  margin-top: 10px;
  position: static; /* IMPORTANT */
}

#addTodo:hover{
  transform: translateY(-2px);
  box-shadow: 0 22px 55px rgba(37,99,235,.30);
  filter: saturate(1.1);
}

#addTodo:active{
  transform: translateY(0) scale(.99);
}

/* ===== Todo list area ===== */
#main{
  margin-top: 18px;
  display:grid;
  gap: 12px;
}

/* ===== Logout button (better) ===== */
#logoutBtn{
  background-color: transparent;
  border: none;
  position: fixed;
  right: 16px;
  top: 16px;
  font-size: 18px;
}
#logoutBtn:hover{
  transform: translateY(-2px) rotate(-3deg);
  filter: saturate(1.05);
}

#logoutBtn:active{
  transform: translateY(0) scale(.98);
}

/* ===== Mobile ===== */
@media (max-width: 520px){
  body{ padding: 12px; }
  form{ padding: 16px; border-radius: 16px; }
  #logoutBtn{ width: 44px; height: 44px; top: 12px; right: 12px; }
  .chip{ padding: 9px 12px; }
}


    </style>
</head>
<body>
    

    <h2 id="name"></h2>
<div class="container">
    <form id="btn">
  <div class="mb-3">
    <label  class="form-label">Title</label>
    <input type="text" class="form-control" id="title" >
   
  </div>
  <div class="mb-3">
     <input type="radio" name="priority" value="high">
    <label for="">High</label>

  <input type="radio" name="priority" id="" value="med">
  <label for="">Medium</label>
   <input type="radio" name="priority" id="" value="low">
   <label for="">Low</label>
  </div>
  <div class="mb-3 form-check">
    <label for=""> Description</label>
    <Textarea placeholder="description" id="description" ></Textarea>
  </div>
  <button type="submit" id="addTodo"  class="btn btn-primary">Add Todo</button>
</form>
</div>
<div class="container">
    <div id="main" class="d-flex gap-2 flex-wrap"></div>
</div>

    <button id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i></button>
       <script type="module" src="config.js"></script>
   <script type="module" src="index.js"></script>
   <script type="module" src="db.js"></script>
</body>
